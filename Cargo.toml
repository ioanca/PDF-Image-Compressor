[package]
name = "pdf-compressor"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight desktop GUI app to compress PDFs by optimizing embedded images while preserving exact page dimensions and layout."

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.18"
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
thiserror = "2.0"
rayon = "1.12"
hayro = "0.9.0"
hayro-jpeg2000 = "0.5.0"
hayro-jbig2 = "0.4.0"
hayro-ccitt = "0.5.0"
mozjpeg = "0.10"
smallvec = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
