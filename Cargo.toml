[package]
name = "pdf-compressor"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight desktop GUI app to compress PDFs by optimizing embedded images while preserving exact page dimensions and layout."

[dependencies]
eframe = "0.37"
rfd = "0.18"
lopdf = "0.47"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "avif",
    "tiff",
    "bmp",
    "gif",
    "rayon",
] }
flate2 = "1.1"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
